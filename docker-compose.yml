services:
  db:
    image: postgres:16-alpine
    container_name: arrowstack-service-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: arrowstack_services
      POSTGRES_USER: arrowstack
      POSTGRES_PASSWORD: arrowstack_dev
    ports:
      - "5432:5432"
    volumes:
      - service_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arrowstack -d arrowstack_services"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  service_db_data:
